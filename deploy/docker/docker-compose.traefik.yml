# Optional overlay: put else-wer behind an existing Traefik (`make docker-up TRAEFIK=1`).
# Written for poochi's Traefik + ew.syedyaseen.dev and not applied yet; prerequisites
# (wildcard cert domain, DNS record) are in docs/todo/15_ELSEWER_HOSTNAME_TLS.md.
# The published HOST_PORT from the base file stays, so direct LAN access keeps working.
services:
  else-wer:
    networks:
      # The project network must be listed explicitly once any networks key is present.
      - default
      - mz-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mz-net"
      - "traefik.http.routers.elsewer.rule=Host(`ew.syedyaseen.dev`)"
      - "traefik.http.routers.elsewer.entrypoints=websecure"
      - "traefik.http.routers.elsewer.tls=true"
      # No tls.certresolver on purpose: the router inherits the entrypoint's wildcard cert.
      - "traefik.http.services.elsewer.loadbalancer.server.port=3000"

networks:
  mz-net:
    external: true
