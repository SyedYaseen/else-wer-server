# Optional overlay: put else-wer behind poochi's existing Traefik (on by default in `make docker-*`; `TRAEFIK=0` skips it).
# Prerequisites (cfdns DNS-01 resolver, *.syedyaseen.dev DNS record) are done -- see
# docs/todo/15_ELSEWER_HOSTNAME_TLS.md.
# The published HOST_PORT from the base file stays, so direct LAN access keeps working.
services:
  else-wer:
    networks:
      # The project network must be listed explicitly once any networks key is present.
      - default
      - mz-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=mz-net"
      - "traefik.http.routers.elsewer.rule=Host(`ew.syedyaseen.dev`)"
      - "traefik.http.routers.elsewer.entrypoints=websecure"
      - "traefik.http.routers.elsewer.tls=true"
      # websecure's default certresolver (cfresolver) only covers themizadah.com -- this
      # router needs the syedyaseen.dev wildcard resolver explicitly.
      - "traefik.http.routers.elsewer.tls.certresolver=cfdns"
      - "traefik.http.services.elsewer.loadbalancer.server.port=3000"

networks:
  mz-net:
    external: true
