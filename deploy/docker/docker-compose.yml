services:
  else-wer:
    build: .
    image: else-wer:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    volumes:
      - else-wer-data:/data
      - ./audiobooks:/audiobooks
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  else-wer-data:
